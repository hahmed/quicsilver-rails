name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        # Quicsilver ships binaries for Ruby 3.4 and 4.0 only, so there is no ruby-head job: it would
        # fail to load the extension rather than test anything.
        ruby: ["3.4", "4.0"]
        rails: ["8.0", "8.1", "main"]
        include:
          - rails: "8.0"
            gemfile: gemfiles/rails-8.0.gemfile
          - rails: "8.1"
            gemfile: Gemfile
          # Locked to one revision in its lockfile, so this job is as stable as the released ones.
          - rails: "main"
            gemfile: gemfiles/rails-main.gemfile
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
