name: Release

# Pushing a version tag publishes the gem:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses RubyGems trusted publishing: the job exchanges a GitHub OIDC token for a short-lived RubyGems
# key, so no API key is stored in the repository.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check the tag matches the gem's version
        run: |
          version="v$(ruby -r ./lib/quicsilver/rails/version -e 'print Quicsilver::Rails::VERSION')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the gem's version, $version" >&2
            exit 1
          fi
      - name: Run the tests
        run: bundle exec rake
      - name: Get RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0
      - name: Build the gem
        run: gem build quicsilver-rails.gemspec
      - name: Publish the gem
        run: gem push quicsilver-rails-*.gem
